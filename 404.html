<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>404 — Gift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101613'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23c5f246'%3EG%3C/text%3E%3C/svg%3E">
<script src="theme-init.js"></script>
<style>
  @font-face{font-family:'Gambarino';src:url('fonts/Gambarino-Regular.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('fonts/Switzer-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('fonts/Switzer-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
  :root{
    --bg:#0d120f; --line:#262e29; --line-2:#343e37; --text:#edf0ea;
    --text-2:#a8b2aa; --text-3:#78837b; --lime:#c5f246; --lime-ink:#0e120c;
    --sans:'Switzer',-apple-system,BlinkMacSystemFont,sans-serif;
    --display:'Gambarino',var(--sans);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f2f0e9; --line:#d9d7cd; --line-2:#bfbdb2; --text:#1b2119;
    --text-2:#4c554c; --text-3:#80897f; --lime:#4d6a02; --lime-ink:#f2f0e9;
  }
  body{transition:background-color .3s,color .3s}
  .theme-toggle svg{width:16px;height:16px}
  .theme-toggle .t-fill{fill:currentColor}
  .theme-toggle .t-ring{fill:none;stroke:currentColor;stroke-width:1.8}
  .theme-toggle .ctl{transition:transform .35s}
  :root[data-theme="light"] .theme-toggle .ctl{transform:rotate(180deg)}
  .theme-toggle:hover{border-color:var(--lime);color:var(--lime)}
  *{box-sizing:border-box;margin:0}
  ::selection{background:var(--lime);color:var(--lime-ink)}
  body{
    background:var(--bg); color:var(--text); font:16px/1.6 var(--sans);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box{max-width:480px}
  .brand{font:700 20px/1 var(--display);letter-spacing:0}
  .brand i{color:var(--lime);font-style:normal}
  .code{font:700 clamp(48px,10vw,88px)/1 var(--display);color:var(--lime);margin:64px 0 16px;letter-spacing:-.02em}
  .label{font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:20px}
  p{color:var(--text-2);font-size:15px;margin-bottom:28px;max-width:44ch}
  a{
    font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);
    border:1px solid var(--line-2); padding:12px 18px; display:inline-block;
    transition:border-color .18s,color .18s;
  }
  a:hover{border-color:var(--lime);color:var(--lime)}
  a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Toggle colour theme" style="position:fixed;top:20px;right:20px;display:grid;place-items:center;width:38px;height:38px;background:none;border:1px solid var(--line-2);color:var(--text-2);cursor:pointer"><svg class="ctl" viewBox="0 0 24 24" aria-hidden="true"><circle class="t-ring" cx="12" cy="12" r="8.5"/><path class="t-fill" d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></svg></button>
  <main class="box">
    <p class="brand">GIFT<i>.</i></p>
    <div class="code">404</div>
    <div class="label">Endpoint not found</div>
    <p>Nothing is deployed at this path. The rest of the research log is on the root page.</p>
    <a href="./">← Back to root</a>
    <a href="./research.html">Research ↗</a>
    <a href="./about.html">About ↗</a>
  </main>
  <script src="theme.js"></script>
</body>
</html>
